# Sample Vale configuration for the AgentIX style.
#
# Copy the AgentIX folder from this skill into your StylesPath (here: ./styles),
# or point StylesPath at this skill's vale/ folder.
StylesPath = styles
MinAlertLevel = suggestion

# Markdown. For MDX, install the mdx2vast helper (npm install -g mdx2vast); Vale
# calls it when it finds an .mdx file. Both extensions share one section.
[*.{md,mdx}]
BasedOnStyles = AgentIX

# Pages that use a rule on purpose turn it off by glob, for example generated
# status pages that carry a "What runs today" heading:
# [src/content/docs/**/status/*.md]
# AgentIX.BannedHeading = NO
# AgentIX.StatusInProse = NO
