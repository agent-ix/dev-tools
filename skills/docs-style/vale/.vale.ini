# Sample Vale configuration for the AgentIX style.
#
# Install: copy BOTH the AgentIX/ folder and the config/ folder of this skill's vale/
# directory into your StylesPath (here ./styles). The six script rules need
# <StylesPath>/config/scripts/. Copying AgentIX/ alone makes Vale stop with E201.
StylesPath = styles
MinAlertLevel = suggestion

# Markdown. For MDX, install the mdx2vast helper (npm install -g mdx2vast); Vale
# calls it when it finds an .mdx file. Both extensions share one section.
[*.{md,mdx}]
BasedOnStyles = AgentIX

# ---- Per-path overrides --------------------------------------------------
# Vale turns a whole rule on or off per glob; it cannot turn off one word.
#
# A page that needs the literal word "trust" (an assurance page about trusted
# signers) turns the one rule off for its path. A page about a mechanism that
# has to contrast two options does the same for ContrastFraming.
# [src/content/docs/assurance/**/*.{md,mdx}]
# AgentIX.TrustWords = NO
# AgentIX.ContrastFraming = NO
#
# Generated status pages carry a "What runs today" heading and state release
# state by design:
# [src/content/docs/**/status/*.{md,mdx}]
# AgentIX.StatusInProse = NO
#
# applies_to: catalog rules limited to some page types are applied the same way,
# one section per type folder. `docs_lint.py --vale-sections` prints them, for example
#   docs_lint.py --vale-sections 'reference=docs/reference/**/*.md'
# [docs/reference/**/*.md]
# AgentIX.CrateNameInProse = NO
# AgentIX.RustPathInProse = NO
# AgentIX.SourcePathInProse = NO
#
# One page or block: <!-- vale AgentIX.LeadIns = NO --> ... <!-- vale AgentIX.LeadIns = YES -->
# in Markdown, {/* vale AgentIX.LeadIns = NO */} in MDX, and <!-- vale off --> ... <!-- vale on -->
# for every rule.
