rule_files: [alerts.yml]
evaluation_interval: 1m
tests:
  - name: each_required_alert_fires_for_hand_calculated_inputs
    interval: 1m
    input_series:
      - series: 'up{job="locked-build",host="busy"}'
        values: '1+0x30'
      - series: 'up{job="locked-build",host="offline"}'
        values: '0+0x30'
      - series: 'up{job="locked-build",host="stale"}'
        values: '1+0x30'
      - series: 'ix_build_export_timestamp_seconds{host="busy"}'
        values: '0+60x30'
      - series: 'ix_build_export_timestamp_seconds{host="stale"}'
        values: '0+0x30'
      - series: 'ix_build_queue_depth{host="busy",class="point"}'
        values: '2+0x30'
      - series: 'ix_build_units_used{host="busy"}'
        values: '2+0x30'
      - series: 'ix_build_units_capacity{host="busy"}'
        values: '8+0x30'
      - series: 'ix_build_oldest_queued_seconds{host="busy"}'
        values: '1200+0x30'
      - series: 'ix_build_running_memory_headroom_ratio{host="busy"}'
        values: '0.05+0x30'
      - series: 'ix_build_terminations_total{host="busy",class="point",code="LB_OOM_KILLED"}'
        values: '0+1x30'
      - series: 'ix_build_wait_seconds_bucket{host="busy",class="point",outcome="ok",le="300"}'
        values: '0+0x30'
      - series: 'ix_build_wait_seconds_bucket{host="busy",class="point",outcome="ok",le="600"}'
        values: '0+1x30'
      - series: 'ix_build_wait_seconds_bucket{host="busy",class="point",outcome="ok",le="+Inf"}'
        values: '0+1x30'
    promql_expr_test:
      - expr: 'ALERTS{alertname="LockedBuildQueueWaitHigh",alertstate="firing"}'
        eval_time: 20m
        exp_samples:
          - labels: 'ALERTS{alertname="LockedBuildQueueWaitHigh",alertstate="firing",host="busy",severity="warning"}'
            value: 1
      - expr: 'ALERTS{alertname="LockedBuildKilled",alertstate="firing"}'
        eval_time: 20m
        exp_samples:
          - labels: 'ALERTS{alertname="LockedBuildKilled",alertstate="firing",host="busy",code="LB_OOM_KILLED",severity="critical"}'
            value: 1
      - expr: 'ALERTS{alertname="LockedBuildQueueStuck",alertstate="firing"}'
        eval_time: 20m
        exp_samples:
          - labels: 'ALERTS{alertname="LockedBuildQueueStuck",alertstate="firing",host="busy",severity="warning"}'
            value: 1
      - expr: 'ALERTS{alertname="LockedBuildMemoryHeadroomLow",alertstate="firing"}'
        eval_time: 20m
        exp_samples:
          - labels: 'ALERTS{alertname="LockedBuildMemoryHeadroomLow",alertstate="firing",host="busy",severity="warning"}'
            value: 1
      - expr: 'ALERTS{alertname="LockedBuildHostNoMetrics",alertstate="firing"}'
        eval_time: 20m
        exp_samples:
          - labels: 'ALERTS{alertname="LockedBuildHostNoMetrics",alertstate="firing",host="offline",job="locked-build",severity="critical"}'
            value: 1
      - expr: 'ALERTS{alertname="LockedBuildExportStale",alertstate="firing"}'
        eval_time: 20m
        exp_samples:
          - labels: 'ALERTS{alertname="LockedBuildExportStale",alertstate="firing",host="stale",severity="critical"}'
            value: 1
  - name: healthy_host_and_idle_queue_do_not_alert
    interval: 1m
    input_series:
      - series: 'up{job="locked-build",host="healthy"}'
        values: '1+0x30'
      - series: 'ix_build_export_timestamp_seconds{host="healthy"}'
        values: '0+60x30'
      - series: 'ix_build_queue_depth{host="healthy",class="point"}'
        values: '0+0x30'
      - series: 'ix_build_units_used{host="healthy"}'
        values: '0+0x30'
      - series: 'ix_build_units_capacity{host="healthy"}'
        values: '8+0x30'
      - series: 'ix_build_oldest_queued_seconds{host="healthy"}'
        values: '0+0x30'
      - series: 'ix_build_running_memory_headroom_ratio{host="healthy"}'
        values: '0.95+0x30'
      - series: 'ix_build_terminations_total{host="healthy",class="point",code="LB_OOM_KILLED"}'
        values: '0+0x30'
      - series: 'ix_build_wait_seconds_bucket{host="healthy",class="point",outcome="ok",le="300"}'
        values: '0+1x30'
      - series: 'ix_build_wait_seconds_bucket{host="healthy",class="point",outcome="ok",le="+Inf"}'
        values: '0+1x30'
    promql_expr_test:
      - expr: 'ALERTS{alertstate="firing"}'
        eval_time: 20m
        exp_samples: []
