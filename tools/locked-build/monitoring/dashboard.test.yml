{
  "rule_files": [
    "alerts.yml"
  ],
  "evaluation_interval": "1m",
  "fuzzy_compare": true,
  "tests": [
    {
      "name": "every provisioned daily-health panel; hand-written values",
      "interval": "1m",
      "input_series": [
        {
          "series": "ix_kache_hits_total{host=\"luna\",store=\"local\",cache_role=\"client\"}",
          "values": "0+8x120"
        },
        {
          "series": "ix_kache_misses_total{host=\"luna\",store=\"local\",cache_role=\"client\"}",
          "values": "0+2x120"
        },
        {
          "series": "ix_kache_local_hits_total{host=\"luna\",store=\"local\",cache_role=\"client\"}",
          "values": "0+6x120"
        },
        {
          "series": "ix_kache_hit_compile_seconds_total{host=\"luna\",store=\"local\",cache_role=\"client\"}",
          "values": "0+60x120"
        },
        {
          "series": "ix_kache_store_bytes{host=\"luna\",store=\"local\",cache_role=\"client\"}",
          "values": "80+0x120"
        },
        {
          "series": "ix_kache_store_limit_bytes{host=\"luna\",store=\"local\",cache_role=\"client\"}",
          "values": "100+0x120"
        },
        {
          "series": "ix_kache_entries{host=\"luna\",store=\"local\",cache_role=\"client\"}",
          "values": "42+0x120"
        },
        {
          "series": "ix_kache_gc_evicted_bytes_total{host=\"luna\",store=\"local\",cache_role=\"client\"}",
          "values": "0+10x120"
        },
        {
          "series": "ix_kache_up{host=\"luna\",store=\"local\",cache_role=\"client\"}",
          "values": "1+0x120"
        },
        {
          "series": "ix_kache_remote_hits_total{host=\"luna\",store=\"shared\",cache_role=\"client\"}",
          "values": "0+2x120"
        },
        {
          "series": "ix_kache_remote_reachable{host=\"luna\",store=\"shared\",cache=\"remote\",backend=\"filesystem\",cache_role=\"client\"}",
          "values": "0+0x120"
        },
        {
          "series": "ix_build_cache_policy_info{host=\"luna\",cache_role=\"client\",cache_mode=\"local\"}",
          "values": "1+0x120"
        },
        {
          "series": "ix_build_run_seconds_bucket{host=\"luna\",class=\"point\",le=\"1\"}",
          "values": "0+1x120"
        },
        {
          "series": "ix_build_run_seconds_bucket{host=\"luna\",class=\"point\",le=\"10\"}",
          "values": "0+2x120"
        },
        {
          "series": "ix_build_run_seconds_bucket{host=\"luna\",class=\"point\",le=\"60\"}",
          "values": "0+4x120"
        },
        {
          "series": "ix_build_run_seconds_bucket{host=\"luna\",class=\"point\",le=\"+Inf\"}",
          "values": "0+4x120"
        },
        {
          "series": "ix_build_wait_seconds_bucket{host=\"luna\",class=\"point\",le=\"60\"}",
          "values": "0+0x120"
        },
        {
          "series": "ix_build_wait_seconds_bucket{host=\"luna\",class=\"point\",le=\"300\"}",
          "values": "0+1x120"
        },
        {
          "series": "ix_build_wait_seconds_bucket{host=\"luna\",class=\"point\",le=\"900\"}",
          "values": "0+2x120"
        },
        {
          "series": "ix_build_wait_seconds_bucket{host=\"luna\",class=\"point\",le=\"+Inf\"}",
          "values": "0+2x120"
        },
        {
          "series": "ix_build_repo_run_seconds_total{host=\"luna\",repo=\"dev-tools\",subcommand=\"build\"}",
          "values": "0+120x120"
        },
        {
          "series": "ix_build_repo_run_count_total{host=\"luna\",repo=\"dev-tools\",subcommand=\"build\"}",
          "values": "0+2x120"
        },
        {
          "series": "ix_build_builds_total{host=\"luna\",class=\"point\",outcome=\"ok\"}",
          "values": "0+3x120"
        },
        {
          "series": "ix_build_builds_total{host=\"luna\",class=\"point\",outcome=\"failed\"}",
          "values": "0+1x120"
        },
        {
          "series": "ix_build_failures_total{host=\"luna\",class=\"point\",code=\"LB_RSS_CAP\"}",
          "values": "0+1x120"
        },
        {
          "series": "node_filesystem_avail_bytes{host=\"luna\",mountpoint=\"/mnt/build\",device=\"/dev/nvme0n1p1\",fstype=\"xfs\"}",
          "values": "42000000000+0x120"
        },
        {
          "series": "node_disk_io_time_seconds_total{host=\"luna\",device=\"nvme0n1\"}",
          "values": "0+30x120"
        }
      ],
      "promql_expr_test": [
        {
          "expr": "ix_kache_up{host=\"luna\"} and on(host) ix_build_cache_policy_info{cache_role=\"client\"}",
          "eval_time": "90m",
          "exp_samples": [
            {
              "labels": "{__name__=\"ix_kache_up\",host=\"luna\",store=\"local\",cache_role=\"client\"}",
              "value": 1
            }
          ]
        },
        {
          "expr": "ix_kache:hit_ratio{host=\"luna\"} and on(host) ix_build_cache_policy_info{cache_role=\"client\"}",
          "eval_time": "90m",
          "exp_samples": [
            {
              "labels": "{__name__=\"ix_kache:hit_ratio\",host=\"luna\",store=\"local\",cache_role=\"client\"}",
              "value": 0.8
            }
          ]
        },
        {
          "expr": "ix_kache:miss_ratio{host=\"luna\"} and on(host) ix_build_cache_policy_info{cache_role=\"client\"}",
          "eval_time": "90m",
          "exp_samples": [
            {
              "labels": "{__name__=\"ix_kache:miss_ratio\",host=\"luna\",store=\"local\",cache_role=\"client\"}",
              "value": 0.2
            }
          ]
        },
        {
          "expr": "ix_kache:hits_1h{host=\"luna\"} and on(host) ix_build_cache_policy_info{cache_role=\"client\"}",
          "eval_time": "90m",
          "exp_samples": [
            {
              "labels": "{__name__=\"ix_kache:hits_1h\",host=\"luna\",store=\"local\",cache_role=\"client\"}",
              "value": 480
            }
          ]
        },
        {
          "expr": "ix_kache:misses_1h{host=\"luna\"} and on(host) ix_build_cache_policy_info{cache_role=\"client\"}",
          "eval_time": "90m",
          "exp_samples": [
            {
              "labels": "{__name__=\"ix_kache:misses_1h\",host=\"luna\",store=\"local\",cache_role=\"client\"}",
              "value": 120
